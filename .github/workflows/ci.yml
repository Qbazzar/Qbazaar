name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Only superseded PR runs are cancelled; a run gating a deploy must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    name: API · Pint + PHPStan + Pest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: qbazaar-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, pcntl, posix, gd, exif, zip, bcmath
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: qbazaar-api/vendor
          key: ${{ runner.os }}-php84-${{ hashFiles('qbazaar-api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php84-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Laravel Pint
        run: vendor/bin/pint --test

      - name: PHPStan (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      - name: Pest
        run: vendor/bin/pest --colors=always

  api-mysql:
    name: API · MySQL locking
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: qbazaar_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: qbazaar-api

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: qbazaar_test
      DB_USERNAME: root
      DB_PASSWORD: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_mysql, pcntl, posix, gd, exif, zip, bcmath
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: qbazaar-api/vendor
          key: ${{ runner.os }}-php84-${{ hashFiles('qbazaar-api/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php84-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pest (row locks on a real InnoDB)
        run: vendor/bin/pest --group=mysql --colors=always
