; QBazaar: OPcache and realpath cache for ea-php84 (OPS-18.11).
;
; Install (root), AFTER the sudoers drop-in that lets deploy-api.sh reload
; PHP-FPM (DOCS/M5-LAUNCH-RUNBOOK.md, step 2):
;   install -m 644 -o root -g root ~qbazaar/qbazaar/deploy/php/zz-qbazaar-opcache.ini \
;       /opt/cpanel/ea-php84/root/etc/php.d/zz-qbazaar-opcache.ini
;   systemctl reload ea-php84-php-fpm
; Rollback: delete the file and reload ea-php84-php-fpm.
;
; php.d is read after php.ini (the MultiPHP INI Editor's file) and in name
; order, so the zz- prefix makes these values win. They apply to every
; ea-php84 site on the box; QBazaar is the only one.

opcache.enable=1
; The CLI (artisan, Horizon, Reverb) always reads fresh code.
opcache.enable_cli=0
; About 17k PHP files (app + vendor). 256 MB and 30k slots leave room to grow;
; check opcache_get_status() for cache_full / oom_restarts after a week.
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=30000
; PHP never re-reads a changed file: a release only runs after PHP-FPM
; reloads. deploy-api.sh reloads it and fails the deploy when it cannot. Any
; manual `config:cache`, `.env` change or hot fix also needs
;   systemctl reload ea-php84-php-fpm
opcache.validate_timestamps=0
; Attributes and docblock-driven packages read comments at runtime.
opcache.save_comments=1
; The JIT helps CPU-bound code, not an I/O-bound API, and costs memory; off.
opcache.jit_buffer_size=0

; Laravel stats thousands of paths per request; cache the lookups for 10 min.
realpath_cache_size=4096K
realpath_cache_ttl=600
