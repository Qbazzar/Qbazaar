# Apache include: answer only requests that come through Cloudflare
# (OPS-18.9, the origin half of "the server's IP address doesn't answer
# directly").
#
# Live on api.qbazaar.qa since 2026-10-21 as zz-cloudflare-only.conf (the
# PHP2Shell response); this is the reviewed copy, so a rebuild keeps it. It can
# also go on the web vhost (WEB_HOST), which has no PHP but is just as reachable
# by IP.
#
# Install on cPanel (root), BOTH tiers, after the vhost's other include:
#   . ~qbazaar/.qbazaar-deploy.env
#   for host in "$API_HOST" "$WEB_HOST"; do for t in std ssl; do
#     d=/etc/apache2/conf.d/userdata/$t/2_4/qbazaar/$host
#     mkdir -p "$d"; cp ~qbazaar/qbazaar/deploy/apache/cloudflare-only.conf "$d/zz-cloudflare-only.conf"
#   done; done
#   sed -i "s/__SERVER_IPV4__/$(hostname -I | tr ' ' '\n' | grep -m1 -E '^[0-9.]+$')/" \
#     /etc/apache2/conf.d/userdata/*/2_4/qbazaar/*/zz-cloudflare-only.conf
#   /scripts/ensure_vhost_includes --user=qbazaar
#   apachectl configtest && systemctl reload httpd
# Check: through Cloudflare 200; `curl -sk -o /dev/null -w '%{http_code}'
# --resolve api.qbazaar.qa:443:<server IP> https://api.qbazaar.qa/up` from
# outside gives 403. Rollback: delete the files, ensure_vhost_includes, reload.
#
# CONN_REMOTE_ADDR is the TCP peer. REMOTE_ADDR cannot be used: mod_remoteip
# (WHM's includes/cloudflare.conf) rewrites it to the visitor's address.
# Cloudflare's ranges change rarely; compare with https://www.cloudflare.com/ips/
# when updating includes/cloudflare.conf, and keep both lists equal.

<Location "/">
    <RequireAny>
        # This box itself: the deploy health probe calls its own public IPv4.
        Require expr "%{CONN_REMOTE_ADDR} -ipmatch '127.0.0.0/8'"
        Require expr "%{CONN_REMOTE_ADDR} -ipmatch '::1/128'"
        Require expr "%{CONN_REMOTE_ADDR} == '__SERVER_IPV4__'"
        # Cloudflare IPv4
        Require expr "%{CONN_REMOTE_ADDR} -ipmatch '173.245.48.0/20'"
        Require expr "%{CONN_REMOTE_ADDR} -ipmatch '103.21.244.0/22'"
        Require expr "%{CONN_REMOTE_ADDR} -ipmatch '103.22.200.0/22'"
        Require expr "%{CONN_REMOTE_ADDR} -ipmatch '103.31.4.0/22'"
        Require expr "%{CONN_REMOTE_ADDR} -ipmatch '141.101.64.0/18'"
        Require expr "%{CONN_REMOTE_ADDR} -ipmatch '108.162.192.0/18'"
        Require expr "%{CONN_REMOTE_ADDR} -ipmatch '190.93.240.0/20'"
        Require expr "%{CONN_REMOTE_ADDR} -ipmatch '188.114.96.0/20'"
        Require expr "%{CONN_REMOTE_ADDR} -ipmatch '197.234.240.0/22'"
        Require expr "%{CONN_REMOTE_ADDR} -ipmatch '198.41.128.0/17'"
        Require expr "%{CONN_REMOTE_ADDR} -ipmatch '162.158.0.0/15'"
        Require expr "%{CONN_REMOTE_ADDR} -ipmatch '104.16.0.0/13'"
        Require expr "%{CONN_REMOTE_ADDR} -ipmatch '104.24.0.0/14'"
        Require expr "%{CONN_REMOTE_ADDR} -ipmatch '172.64.0.0/13'"
        Require expr "%{CONN_REMOTE_ADDR} -ipmatch '131.0.72.0/22'"
        # Cloudflare IPv6
        Require expr "%{CONN_REMOTE_ADDR} -ipmatch '2400:cb00::/32'"
        Require expr "%{CONN_REMOTE_ADDR} -ipmatch '2606:4700::/32'"
        Require expr "%{CONN_REMOTE_ADDR} -ipmatch '2803:f800::/32'"
        Require expr "%{CONN_REMOTE_ADDR} -ipmatch '2405:b500::/32'"
        Require expr "%{CONN_REMOTE_ADDR} -ipmatch '2405:8100::/32'"
        Require expr "%{CONN_REMOTE_ADDR} -ipmatch '2a06:98c0::/29'"
        Require expr "%{CONN_REMOTE_ADDR} -ipmatch '2c0f:f248::/32'"
    </RequireAny>
</Location>
