# Apache reverse-proxy include for the FRONTEND vhost (WEB_HOST in
# ~/.qbazaar-deploy.env, today qbazaar.187-53-139-138.sslip.io).
# Routes everything to the Next.js systemd service on 127.0.0.1:3000, EXCEPT
# /.well-known (left to Apache so AutoSSL/Let's Encrypt renewal keeps working).
#
# Install on cPanel (root) — place in BOTH std + ssl tiers:
#   . ~qbazaar/.qbazaar-deploy.env
#   for t in std ssl; do
#     d=/etc/apache2/conf.d/userdata/$t/2_4/qbazaar/$WEB_HOST
#     mkdir -p "$d"; cp ~qbazaar/qbazaar/deploy/apache/web.include.conf "$d/proxy.conf"
#   done
#   /scripts/ensure_vhost_includes --user=qbazaar
#   apachectl configtest && systemctl restart httpd
#
# Requires modules: proxy, proxy_http, headers, rewrite.

ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

# Don't proxy ACME challenges — Apache serves them for SSL renewal.
ProxyPass /.well-known !

ProxyPass        / http://127.0.0.1:3000/ retry=0
ProxyPassReverse / http://127.0.0.1:3000/
