# Apache include for the API vhost (API_HOST in ~/.qbazaar-deploy.env,
# today api.qbazaar.187-53-139-138.sslip.io).
#
# Responsibilities:
#  1. Grant access + AllowOverride for the Laravel public docroot and cap the
#     request body. PHP 8.4 is pinned by cPanel itself: the vhost runs on
#     PHP-FPM (MultiPHP Manager, ea-php84), whose handler lives in the vhost,
#     not in .htaccess, so the deploy's `git reset --hard` cannot undo it.
#  2. Serve /storage (user uploads) as static files only, never through PHP.
#  3. Proxy the Reverb websocket (/app, /apps) to the local server.
#
# Install on cPanel (root) — place in BOTH std + ssl tiers:
#   . ~qbazaar/.qbazaar-deploy.env
#   for t in std ssl; do
#     d=/etc/apache2/conf.d/userdata/$t/2_4/qbazaar/$API_HOST
#     mkdir -p "$d"; cp ~qbazaar/qbazaar/deploy/apache/api.include.conf "$d/qbazaar.conf"
#   done
#   /scripts/ensure_vhost_includes --user=qbazaar
#   apachectl configtest && systemctl restart httpd
#
# Requires modules: proxy, proxy_http, proxy_wstunnel, rewrite, headers.

<Directory "/home/qbazaar/qbazaar/qbazaar-api/public">
    AllowOverride All
    Require all granted
    Options +FollowSymLinks -Indexes
    # 105 MiB: one ad-image upload carries up to 10 files of 10 MB plus the
    # multipart overhead. Keep in step with PHP post_max_size (deploy/README.md).
    LimitRequestBody 110100480
    # No PHP SetHandler here: on an FPM vhost it would replace cPanel's
    # proxy_fcgi handler with the slower CGI one.
</Directory>

# /storage is the public-disk symlink holding user uploads: serve files as
# static content only. <Location> is merged after <Directory>/<Files>, so this
# wins over any PHP handler cPanel adds for the docroot.
<Location "/storage/">
    SetHandler None
    Options -ExecCGI -Indexes
    <IfModule headers_module>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox"
        Header set Cache-Control "public, max-age=86400"
    </IfModule>
</Location>
# Conversion paths are server-generated and never rewritten (BE-13.34), so
# the CDN (cdn. host, MEDIA_CDN_URL) and browsers may keep them for a year.
<LocationMatch "^/storage/[^/]+/conversions/">
    <IfModule headers_module>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </IfModule>
</LocationMatch>
<LocationMatch "(?i)^/storage/.*\.(php[0-9]*|phtml|phar|phps|html?|svgz?|shtml)$">
    Require all denied
</LocationMatch>

# Browser connects to: wss://<API_HOST>/app/<REVERB_APP_KEY>
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/?(app|apps)/(.*)$ ws://127.0.0.1:8080/$1/$2 [P,L]
ProxyPassReverse /app  ws://127.0.0.1:8080/app
ProxyPassReverse /apps ws://127.0.0.1:8080/apps
