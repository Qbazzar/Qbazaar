# Apache include for the API vhost (api.qbazaar.fleeteye.de).
#
# Responsibilities:
#  1. Grant access + AllowOverride for the Laravel public docroot, and pin the
#     PHP version in the VHOST (not .htaccess). cPanel writes its PHP-version
#     AddHandler into the docroot's .htaccess, which `git reset --hard` wipes on
#     every deploy — so we set it here, where the deploy can't touch it.
#  2. Serve /storage (user uploads) as static files only, never through PHP.
#  3. Proxy the Reverb websocket (/app, /apps) to the local server.
#
# Install on cPanel (root) — place in BOTH std + ssl tiers:
#   for t in std ssl; do
#     d=/etc/apache2/conf.d/userdata/$t/2_4/fleeteye/api.qbazaar.fleeteye.de
#     mkdir -p "$d"; cp deploy/apache/api.qbazaar.fleeteye.de.include.conf "$d/qbazaar.conf"
#   done
#   /scripts/ensure_vhost_includes --user=fleeteye
#   apachectl configtest && systemctl restart httpd
#
# Requires modules: proxy, proxy_http, proxy_wstunnel, rewrite, headers.

<Directory "/home/fleeteye/public_html/qbazaar/qbazaar-api/public">
    AllowOverride All
    Require all granted
    Options +FollowSymLinks -Indexes
    # 105 MiB: one ad-image upload carries up to 10 files of 10 MB plus the
    # multipart overhead. Keep in step with PHP post_max_size (deploy/README.md).
    LimitRequestBody 110100480
    # Pin PHP 8.4 at the vhost level so it survives the deploy's git reset
    # (cPanel's per-docroot .htaccess handler line gets reverted otherwise).
    # FilesMatch anchors on the LAST extension; AddHandler would also execute
    # "avatar.php.jpg" because it matches any extension in the name.
    <FilesMatch "\.(php|php8|phtml)$">
        SetHandler application/x-httpd-ea-php84
    </FilesMatch>
</Directory>

# /storage is the public-disk symlink holding user uploads: serve files as
# static content only. <Location> is merged after <Directory>/<Files>, so this
# wins over any PHP handler cPanel adds for the docroot.
<Location "/storage/">
    SetHandler None
    Options -ExecCGI -Indexes
    <IfModule headers_module>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Content-Security-Policy "default-src 'none'; img-src 'self'; sandbox"
    </IfModule>
</Location>
<LocationMatch "(?i)^/storage/.*\.(php[0-9]*|phtml|phar|phps|html?|svgz?|shtml)$">
    Require all denied
</LocationMatch>

# Browser connects to: wss://api.qbazaar.fleeteye.de/app/<REVERB_APP_KEY>
RewriteEngine On
RewriteCond %{HTTP:Upgrade} =websocket [NC]
RewriteRule ^/?(app|apps)/(.*)$ ws://127.0.0.1:8080/$1/$2 [P,L]
ProxyPassReverse /app  ws://127.0.0.1:8080/app
ProxyPassReverse /apps ws://127.0.0.1:8080/apps
