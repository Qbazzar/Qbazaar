# QBazaar: the queue Redis (OPS-18.12), the existing instance on 127.0.0.1:6379.
#
# Holds what must never be evicted or lost on a restart: queued jobs and
# Horizon's state, admin sessions, cache locks (lock_connection = default)
# and the ad-view buffer. The cache moves to its own instance (cache.conf),
# so this one can refuse writes when full rather than drop a job.
#
# Install (root), DOCS/M5-LAUNCH-RUNBOOK.md step 5. It is included AFTER the
# existing /etc/redis/qbazaar.conf, which keeps `bind` and `requirepass`; the
# later file wins for any setting both define:
#   install -m 640 -o root -g redis ~qbazaar/qbazaar/deploy/redis/queue.conf /etc/redis/qbazaar-queue.conf
#   grep -q '^include /etc/redis/qbazaar-queue.conf' /etc/redis/redis.conf || \
#     echo 'include /etc/redis/qbazaar-queue.conf' >> /etc/redis/redis.conf
# Turn AOF on live first (the runbook's commands), so the next restart finds
# an AOF that already holds the data.

maxmemory 1gb
maxmemory-policy noeviction

# Append-only file, fsync once a second: at most one second of queue writes
# is lost on a crash. The RDB preamble keeps rewrites and restarts fast.
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
