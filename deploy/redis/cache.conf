# QBazaar: the cache Redis (OPS-18.12), a second instance on 127.0.0.1:6380.
#
# Only Laravel's cache store lives here (home feed, counters, rate limits,
# settings). Everything in it can be rebuilt, so it evicts the least recently
# used keys when full and keeps nothing on disk.
#
# Install (root), DOCS/M5-LAUNCH-RUNBOOK.md step 5:
#   install -m 640 -o root -g redis ~qbazaar/qbazaar/deploy/redis/cache.conf /etc/redis/qbazaar-cache.conf
#   ( umask 077; openssl rand -hex 32 > /root/qbazaar-secrets/redis_cache_password )
#   printf 'requirepass %s\n' "$(cat /root/qbazaar-secrets/redis_cache_password)" > /etc/redis/qbazaar-cache-auth.conf
#   chown root:redis /etc/redis/qbazaar-cache-auth.conf && chmod 640 /etc/redis/qbazaar-cache-auth.conf
#   install -m 644 ~qbazaar/qbazaar/deploy/systemd/redis-cache.service /etc/systemd/system/
#   systemctl daemon-reload && systemctl enable --now redis-cache

bind 127.0.0.1 -::1
protected-mode yes
port 6380
# systemd (redis-cache.service) supervises the process.
daemonize no
supervised systemd
dir /var/lib/redis-cache
logfile /var/log/redis/redis-cache.log
loglevel notice

maxmemory 384mb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# No persistence: a restart starts with an empty cache, which the catalog
# warmer refills within two minutes.
save ""
appendonly no

# requirepass, kept out of the repo (root:redis 640).
include /etc/redis/qbazaar-cache-auth.conf
